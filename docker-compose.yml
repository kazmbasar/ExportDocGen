services:
  app:
    build: .
    image: exportdocgen:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__UserName: "${AUTH_USERNAME:-Team}"
      Auth__PasswordHash: "${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env — run: docker compose run --rm --no-deps app hash-password 'your-password'}"
    volumes:
      - app-data:/data
    # Loopback only: the app is reachable from host nginx, never from the
    # internet. (Docker's own iptables rules bypass the host INPUT chain, so
    # binding 0.0.0.0 here WOULD expose 8080 — keep the 127.0.0.1 prefix.)
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  app-data:
