# ExportDocGen — nginx reverse proxy (host install, TLS added by certbot)
#
# Install:
#   sudo cp deploy/nginx/exportdocgen.conf /etc/nginx/sites-available/exportdocgen
#   #  ... edit server_name below ...
#   sudo cp deploy/nginx/upgrade.conf /etc/nginx/conf.d/upgrade.conf
#   sudo ln -s /etc/nginx/sites-available/exportdocgen /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d exportdocgen.example.com      # adds the :443 block + redirect
#
# (Oracle Linux / RHEL nginx has no sites-enabled — put this file directly in
#  /etc/nginx/conf.d/exportdocgen.conf instead, and skip the symlink/default steps.)

server {
    listen 80;
    listen [::]:80;

    # ---- change this to your real hostname ----
    server_name exportdocgen.example.com;

    # The app is a Blazor Server circuit + streams generated PDFs/XLSX; customer
    # order and stock imports upload .xlsx files. 1 MB (nginx default) is too low.
    client_max_body_size 32m;

    # Access/error logs for this site only.
    access_log /var/log/nginx/exportdocgen.access.log;
    error_log  /var/log/nginx/exportdocgen.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the Blazor Server SignalR circuit (/_blazor).
        # $connection_upgrade is defined in conf.d/upgrade.conf.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep the SignalR connection alive through idle periods.
        proxy_read_timeout  100s;
        proxy_send_timeout  100s;

        proxy_buffering off;   # stream PDF/XLSX responses straight through
    }
}
